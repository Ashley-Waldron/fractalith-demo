server:
  port: 8080

modules:
  order:
    enabled: true
    event:
      type: kafka
  payment:
    enabled: true
    event:
      type: kafka
  search:
    enabled: false
    consumers:
      order-placed: kafka
      payment: local
    api:
      type: http
  inventory:
    enabled: true
    api:
      type: local

spring:
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      auto-offset-reset: earliest
