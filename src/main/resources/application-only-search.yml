spring:
  application:
    name: fractalith
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8080}

modules:
  shop:
    enabled: false
  search:
    enabled: true
    consumers:
      order-placed: ${MODULE_SEARCH_CONSUMERS_ORDER_PLACED:kafka}
  order:
    enabled: false
  payment:
    enabled: false
  inventory:
    enabled: false
  shipping:
    enabled: false

logging:
  level:
    ie:
      bitstep:
        fractalith: DEBUG
